# Render Blueprint for the StockPilot API server.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: stockpilot-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /home
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ADMIN_API_SECRET
        sync: false
      # Comma-separated allowed browser origins (your deployed client URL).
      - key: CLIENT_ORIGIN
        sync: false
